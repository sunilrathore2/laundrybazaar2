  <script>
    // GitHub Pages -> Apps Script RPC adapter.
    // Keep this URL synchronized with the currently deployed Apps Script web app.
    (function () {
      'use strict';
      var APP_URL = 'https://script.google.com/macros/s/AKfycbyCpnx0zlYtLK4XYDZlMCxhh7IPp5hwjScP5OHVxkXlnM_JKDBQ2cdhRHMh5He28wZWAw/exec';
      var pending = Object.create(null);
      var sequence = 0;

      function cleanup(id) {
        var job = pending[id];
        if (!job) return;
        clearTimeout(job.timer);
        if (job.form && job.form.parentNode) job.form.parentNode.removeChild(job.form);
        if (job.frame && job.frame.parentNode) job.frame.parentNode.removeChild(job.frame);
        delete pending[id];
      }

      window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.type !== 'LB_FORM_RPC_RESULT' || !data.id || !pending[data.id]) return;
        var job = pending[data.id];
        cleanup(data.id);
        if (data.ok) {
          if (typeof job.success === 'function') job.success(data.result);
        } else if (typeof job.failure === 'function') {
          job.failure(new Error(data.error || 'Backend request failed.'));
        }
      });

      function invoke(method, args, success, failure) {
        var id = 'lb_' + Date.now() + '_' + (++sequence);
        var frame = document.createElement('iframe');
        frame.name = id;
        frame.style.cssText = 'position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0;opacity:0';
        frame.setAttribute('aria-hidden', 'true');
        document.body.appendChild(frame);

        var form = document.createElement('form');
        form.method = 'POST';
        form.action = APP_URL;
        form.target = id;
        form.style.display = 'none';
        [['lbRpc','1'],['id',id],['method',method],['args',JSON.stringify(args || [])]].forEach(function (pair) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = pair[0];
          input.value = pair[1];
          form.appendChild(input);
        });
        document.body.appendChild(form);
        pending[id] = {
          success: success,
          failure: failure,
          frame: frame,
          form: form,
          timer: setTimeout(function () {
            var current = pending[id];
            cleanup(id);
            if (current && typeof current.failure === 'function') {
              current.failure(new Error('Backend connection timeout calling ' + method + '. Check that the latest Apps Script Code is deployed as a new web-app version.'));
            }
          }, 45000)
        };
        form.submit();
      }

      function makeRunner(success, failure) {
        return new Proxy({}, {
          get: function (_target, property) {
            if (property === 'withSuccessHandler') {
              return function (handler) { return makeRunner(handler, failure); };
            }
            if (property === 'withFailureHandler') {
              return function (handler) { return makeRunner(success, handler); };
            }
            if (property === 'then') return undefined;
            return function () { invoke(String(property), Array.prototype.slice.call(arguments), success, failure); };
          }
        });
      }

      window.google = window.google || {};
      window.google.script = window.google.script || {};
      window.google.script.run = makeRunner(null, function (error) {
        console.error(error && error.message ? error.message : error);
      });
      window.LAUNDRY_BAZAAR_APP_URL = APP_URL;
    }());
  </script>

  <script>
    // Function to capitalize first letter of each word
    function capitalizeWords(text) {
      if (!text || text.trim() === '') return '';
      
      return text.toString()
        .toLowerCase()
        .split(' ')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(' ')
        .trim();
    }

    // Function to capitalize input in real-time
    function capitalizeInput(inputElement) {
      const cursorPosition = inputElement.selectionStart;
      const originalValue = inputElement.value;
      
      inputElement.value = capitalizeWords(originalValue);
      
      // Restore cursor position
      inputElement.setSelectionRange(cursorPosition, cursorPosition);
    }

    // Main tab switch
    function showTab(tabId, evt) {
      document.querySelectorAll('.section').forEach(div => div.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      const section = document.getElementById(tabId);
      if (!section) return;
      section.classList.add('active');
      if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
      } else {
        document.querySelectorAll('.tab').forEach(function(t){
          if (t.getAttribute('onclick') === "showTab('" + tabId + "')") t.classList.add('active');
        });
      }
      if (tabId === 'tokenSection' && getActiveSessionToken() && currentUser) {
        loadTokens();
      }
    }

    // Reports sub-tab switch
    function showReportTab(evt, tabId) {
      document.querySelectorAll('.reportTabContent').forEach(div => div.style.display = 'none');
      document.querySelectorAll('.reportTabBtn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      evt.currentTarget.classList.add('active');
    }

    let serviceOptions = [];
    let tokenServicesReady_ = false;
    let lookupTimeout = null;

    let sessionToken = localStorage.getItem('lbSession') || '';
    let currentUser = null;
    let sourceTokenNumber = '';
    let voiceTokenRecognition = null;
    let voiceTokenConfirmRecognition = null;

    window.onload = function() {
      if (sessionToken) {
        google.script.run
          .withSuccessHandler(function(res){
            if (res && res.success) {
              activateSession({token:sessionToken, username:res.username, role:res.role});
            } else {
              localStorage.removeItem('lbSession');
              sessionToken='';
              document.getElementById('loginUsername').focus();
            }
          })
          .withFailureHandler(function(){
            localStorage.removeItem('lbSession');
            sessionToken='';
            document.getElementById('loginUsername').focus();
          })
          .getSession(sessionToken);
      } else {
        document.getElementById('loginUsername').focus();
      }
    };

    function activateSession(res) {
      var normalizedRole=String(res.role||'').trim().toLowerCase();
      sessionToken=res.token||sessionToken;
      currentUser={username:res.username, role:normalizedRole};
      localStorage.setItem('lbSession',sessionToken);
      document.getElementById('loginOverlay').style.display='none';
      var userBar=document.getElementById('userBar');
      userBar.style.display='flex';
      userBar.style.flexDirection='column';
      userBar.style.alignItems='flex-end';
      userBar.style.justifyContent='center';
      userBar.textContent='';
      var logoutButton=document.createElement('button');
      logoutButton.type='button';
      logoutButton.className='btn logout-btn';
      logoutButton.textContent='Logout';
      logoutButton.onclick=doLogout;
      userBar.appendChild(logoutButton);
      applyRole(normalizedRole);
      google.script.run.withSuccessHandler(setLogo).getLogo(sessionToken);
      google.script.run.withSuccessHandler(setServices).getServices(sessionToken);
      addNewOrder();
      if(normalizedRole==='admin') loadTelegramSettings();
      if(normalizedRole==='delivery' || normalizedRole==='admin' || normalizedRole==='manager') { newToken(); loadTokens(); }
    }

    function doLogin() {
      const u=document.getElementById('loginUsername').value.trim();
      const p=document.getElementById('loginPassword').value;
      // Discard any token left by an older deployment before obtaining a fresh session.
      sessionToken='';
      document.getElementById('loginError').textContent='';
      google.script.run.withSuccessHandler(function(res){
        if(!res || !res.success){ document.getElementById('loginError').textContent=(res&&res.message)||'Login failed'; return; }
        activateSession(res);
      }).withFailureHandler(function(e){
        document.getElementById('loginError').textContent='Login error: '+(e&&e.message?e.message:String(e||'Unknown backend error'));
      }).login(u,p);
    }

    function showLoginScreen(){
      var userBar=document.getElementById('userBar');
      userBar.style.display='none';
      userBar.textContent='';
      document.getElementById('loginPassword').value='';
      document.getElementById('loginError').textContent='';
      document.getElementById('loginOverlay').style.display='flex';
      setTimeout(function(){ document.getElementById('loginUsername').focus(); },0);
    }

    function doLogout(){
      var t=getActiveSessionToken();
      localStorage.removeItem('lbSession');
      sessionToken='';
      currentUser=null;
      showLoginScreen();
      if(t){
        google.script.run
          .withSuccessHandler(function(){})
          .withFailureHandler(function(){})
          .logout(t);
      }
    }

    function applyRole(role){
      role=String(role||'').trim().toLowerCase();
      const map={orderBooking:['admin','manager'],deliverySection:['admin','manager','delivery'],invoiceSection:['admin','manager'],tagSection:['admin','manager'],reportSection:['admin','manager'],logoUpload:['admin'],tokenSection:['admin','manager','delivery'],adminSection:['admin']};
      document.querySelectorAll('.tab').forEach(function(t){ t.style.display=''; });
      Object.keys(map).forEach(function(id){ var el=document.getElementById(id); if(el){ var tab=document.querySelector('[onclick="showTab(\''+id+'\')"]'); if(map[id].indexOf(role)<0){ if(el)el.style.display='none'; if(tab)tab.style.display='none'; } }});
      var tabsGrid=document.querySelector('.tabs-grid');
      if(tabsGrid){
        var visibleTabs=Array.from(tabsGrid.children).filter(function(t){
          return t.classList.contains('tab') && t.style.display!=='none';
        }).length;
        var cols=visibleTabs>=7?4:(visibleTabs>=5?3:Math.max(1,Math.min(4,visibleTabs)));
        tabsGrid.style.setProperty('--tab-cols',cols);
      }
      var tokenTableArea=document.getElementById('tokenTableArea');
      var refreshTokensBtn=document.getElementById('refreshTokensBtn');
      if(tokenTableArea) tokenTableArea.style.display='block';
      if(refreshTokensBtn) refreshTokensBtn.style.display='inline-block';
      if(role==='delivery'){ showTab('tokenSection'); }
    }

    function lookupTokenCustomer(){
      const p = document.getElementById('tokenPhone').value.trim();
      if(/^\d{10}$/.test(p)){
        const nameAtRequest=document.getElementById('tokenCustomerName').value;
        google.script.run.withSuccessHandler(function(n){
          // Existing customer records may contain Hindi or English names.
          // Do not silently discard a valid backend match based on script/language.
          if(typeof n==='string' && n.trim() && document.getElementById('tokenPhone').value.trim()===p && document.getElementById('tokenCustomerName').value===nameAtRequest) document.getElementById('tokenCustomerName').value=n.trim();
        }).getCustomerByPhone(p, getActiveSessionToken());
      }
    }

    var tokenLoadGeneration_=0;
    function refreshToken_(){
      if(localStorage.getItem('lbPending_token_'+(currentUser&&currentUser.username||''))){
        alert('पिछले Save की पुष्टि बाकी है। पहले token list और records जाँचें; Refresh से duplicate protection नहीं हटेगी।');return;
      }
      newToken();
    }
    function newToken(){
      if(!currentUser||!getActiveSessionToken()){
        document.getElementById('tokenError').textContent='Login must be verified by the backend before a token number can be requested.';return;
      }
      stopVoiceToken();
      var generation=++tokenLoadGeneration_;
      tokenVoicePending_=null;tokenVoiceDraft_=null;
      ['tokenNumber','tokenCustomerName','tokenPhone','tokenRemark'].forEach(function(id){document.getElementById(id).value='';});
      ['tokenDate','tokenDeliveryDate'].forEach(function(id){document.getElementById(id).value=new Date().toISOString().slice(0,10);});
      renderTokenItemsTable([],true);
      document.getElementById('saveTokenBtn').disabled=true;
      if(typeof guidedVoice_!=='undefined'){guidedVoice_.entryPending=null;guidedVoice_.acceptEntryOnce=false;}
      if(typeof guidedVoice_!=='undefined')guidedVoice_.loadingToken=true;
      document.getElementById('tokenError').textContent='Requesting token number from backend…';
      google.script.run.withSuccessHandler(function(n){
        if(generation!==tokenLoadGeneration_)return;
        tokenVoicePending_=null;tokenVoiceDraft_=null;tokenVoiceActive_=false;
        document.getElementById('tokenNumber').value = n;
        document.getElementById('tokenDate').value = new Date().toISOString().slice(0,10);
        document.getElementById('tokenCustomerName').value = '';
        document.getElementById('tokenPhone').value = '';
        document.getElementById('tokenDeliveryDate').value = new Date().toISOString().slice(0,10);
        document.getElementById('tokenQuantity').value = 0;
        document.getElementById('tokenRemark').value = '';
        renderTokenItemsTable([],true);
        document.getElementById('saveTokenBtn').disabled = false;
        document.getElementById('tokenError').textContent = '';
        if(typeof guidedVoice_!=='undefined'){guidedVoice_.loadingToken=false;guidedVoice_.maybeAuto();}
      }).withFailureHandler(function(e){
        if(generation!==tokenLoadGeneration_)return;
        if(typeof guidedVoice_!=='undefined')guidedVoice_.loadingToken=false;
        document.getElementById('tokenError').textContent = 'Unable to get new token number: '+(e.message||e);
      }).getNewTokenNumber(getActiveSessionToken());
    }

    function bookingRequestStorageKey_(type){
      return 'lbPending_'+String(type||'booking')+'_'+String(currentUser&&currentUser.username||'');
    }

    function bookingFingerprint_(obj){
      var copy=JSON.parse(JSON.stringify(obj||{}));delete copy.requestId;
      var text=JSON.stringify(copy),hash=2166136261;
      for(var i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619);}
      return (hash>>>0).toString(36)+'_'+text.length;
    }

    function bookingRequestId_(type,obj){
      var key=bookingRequestStorageKey_(type),fingerprint=bookingFingerprint_(obj),now=Date.now(),pending=null;
      try{pending=JSON.parse(localStorage.getItem(key)||'null');}catch(e){localStorage.removeItem(key);}
      if(pending&&pending.id&&pending.fingerprint===fingerprint)return pending.id;
      if(pending&&pending.id&&pending.fingerprint!==fingerprint&&now-Number(pending.createdAt||0)<300000){
        throw new Error('पिछली Token Save request की पुष्टि बाकी है। Token list जाँचें; 5 मिनट बाद नई request की जा सकती है।');
      }
      var id=(window.crypto&&typeof window.crypto.randomUUID==='function')?window.crypto.randomUUID():('lb_'+now+'_'+Math.random().toString(36).slice(2,12));
      localStorage.setItem(key,JSON.stringify({id:id,fingerprint:fingerprint,createdAt:now}));
      return id;
    }

    function clearBookingRequest_(type){
      localStorage.removeItem(bookingRequestStorageKey_(type));
    }

    function saveTokenBooking(){
      if(document.getElementById('saveTokenBtn').disabled)return;
      stopVoiceToken();
      const items = getTokenItemsForSave_();
      const obj = {
        tokenNumber: document.getElementById('tokenNumber').value,
        tokenDate: document.getElementById('tokenDate').value,
        customerName: document.getElementById('tokenCustomerName').value.trim(),
        phone: document.getElementById('tokenPhone').value.trim(),
        quantity: items.reduce(function(sum,it){return sum+Number(it.qty||0);},0),
        deliveryDate: document.getElementById('tokenDeliveryDate').value,
        totalAmount: 0, // Compatibility with the existing token backend; pricing starts in Book Order.
        items: items,
        remark: document.getElementById('tokenRemark').value.trim()
      };
      if(!obj.customerName) return alert('Customer Name required.');
      if(!validFormText_(obj.customerName)||items.some(function(it){return !validFormText_(it.item);})||(obj.remark&&!validFormText_(obj.remark)))return alert('नाम, आइटम और रिमार्क में सही Hindi या English text भरें।');
      if(!/^\d{10}$/.test(obj.phone)) return alert('Phone must be exactly 10 digits.');
      if(!obj.deliveryDate) return alert('Delivery Date required.');
      if(!items.length || items.some(function(it){ return !it.service || !it.item || !Number.isInteger(Number(it.qty)) || Number(it.qty)<=0 || (/^(KG|WF)$/.test(it.service) && !(Number(it.weight)>0)); })) {
        return alert('Enter valid Service, Item and Quantity; enter Weight for KG items.');
      }

      try{obj.requestId=bookingRequestId_('token',obj);}catch(e){alert(e.message);return;}
      document.getElementById('saveTokenBtn').disabled = true;
      google.script.run
        .withSuccessHandler(function(n){
          clearBookingRequest_('token');
          document.getElementById('tokenError').textContent = 'Token Saved: '+n+' | Status: Pending';
          if(typeof guidedVoice_!=='undefined')guidedVoice_.el('guidedQuestion').textContent='टोकन नंबर '+n+' सफलतापूर्वक सेव हो गया है।';
          document.getElementById('tokenError').className = 'success';
          loadTokens();
          // Open a new token only after the complete final announcement.
          announceTokenSaved_(n,function(){newToken();});
        })
        .withFailureHandler(function(e){
          document.getElementById('tokenError').textContent = 'Error: '+(e.message||e);
          if(typeof guidedVoice_!=='undefined')guidedVoice_.el('guidedQuestion').textContent='Save की पुष्टि नहीं हुई: '+(e.message||e)+'. दोबारा save करने से पहले token list जाँचें।';
          document.getElementById('tokenError').className = 'error';
          document.getElementById('saveTokenBtn').disabled = false;
        })
        .saveToken(obj, getActiveSessionToken());
    }

    function announceTokenSaved_(number,done){
      var toast=document.getElementById('tokenSaveToast');
      if(!toast){toast=document.createElement('div');toast.id='tokenSaveToast';toast.setAttribute('role','status');document.body.appendChild(toast);}
      toast.textContent='✓ टोकन नंबर '+number+' सफलतापूर्वक सेव हो गया है।';toast.style.display='block';

    function voiceEditDistance_(a,b){
      a=String(a||'');b=String(b||'');

      for(j=0;j<=b.length;j++)previous[j]=j;
      for(i=1;i<=a.length;i++){
        current=[i];
        for(j=1;j<=b.length;j++)current[j]=Math.min(current[j-1]+1,previous[j]+1,previous[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
        previous=current;
      }
      return previous[b.length];
    }

    function voiceComparable_(value,phonetic){
      var text=String(value||'').toLowerCase().replace(/[^a-z0-9\u0900-\u097f]+/g,'');
      if(!phonetic)return text.replace(/(.)\1{2,}/g,'$1$1');

        .replace(/[wv]/g,'v').replace(/[cq]/g,'k').replace(/z/g,'s').replace(/x/g,'ks')
        .replace(/[aeiouy]/g,'').replace(/(.)\1+/g,'$1');
    }

    function voiceSimilarity_(heard,target){
      var a=voiceComparable_(heard,false),b=voiceComparable_(target,false);
      if(!a||!b)return 0;
      var literal=1-voiceEditDistance_(a,b)/Math.max(a.length,b.length);
      var pa=voiceComparable_(heard,true),pb=voiceComparable_(target,true);
      var phonetic=pa&&pb?1-voiceEditDistance_(pa,pb)/Math.max(pa.length,pb.length):0;
      return Math.max(literal,phonetic*0.96);
    }

    function quickVoiceServiceCode_(spoken){

    function detectVoiceServiceCode_(spoken,isKg){

    function serviceOptionCode_(option){
      var label=String(option||'').trim().toUpperCase().replace(/[._/()\[\]:-]+/g,' ').replace(/\s+/g,' ').trim();
      // Sheet labels sometimes contain spoken-style spaced codes: K G / I R.
      label=label.replace(/(?:^|\s)K\s+G(?=\s|$)/g,' KG')
        .replace(/(?:^|\s)I\s+R(?=\s|$)/g,' IR')
        .replace(/(?:^|\s)W\s+I(?=\s|$)/g,' WI')
        .replace(/(?:^|\s)W\s+F(?=\s|$)/g,' WF')
        .replace(/(?:^|\s)D\s+C(?=\s|$)/g,' DC')
        .replace(/(?:^|\s)S\s+H(?=\s|$)/g,' SH').replace(/\s+/g,' ').trim();

      // or "KG - Wash Fold".
      if(/(?:^|\s)WF(?=\s|$)|WASH\s*(?:&|AND)?\s*FOLD|KG.*FOLD/.test(label))return 'WF';
      // Prefer explicit standalone codes anywhere in a labelled option.
      var explicit=label.match(/(?:^|\s)(WI|WF|DC|IR|SH|KG)(?=\s|$)/);
      if(explicit)return explicit[1];
      if(/WASH\s*(?:&|AND)?\s*IRON|WASH.*PRESS/.test(label))return 'WI';
      if(/DRY.*CLEAN/.test(label))return 'DC';
      if(/IRON(?:ING)?(?:\s*ONLY)?|PRESS(?:ING)?(?:\s*ONLY)?/.test(label))return 'IR';
      if(/SHOE.*CLEAN/.test(label))return 'SH';
      if(/^(?:KILO|KILOGRAM|KILO GRAM)$/.test(label))return 'KG';
      return '';
    }

    function resolveVoiceService_(spoken, isKg){
      var code=detectVoiceServiceCode_(spoken,isKg);
      if(code==='BLK')return '';
      if(!code)return '';
      var matched=serviceOptions.find(function(opt){return serviceOptionCode_(opt)===code;});
      if(matched)return matched;
      // Speech can be recognized before/without a matching Services-sheet row.
      // Keep the two canonical standalone services usable and ensure the
      // selected value also exists in the rendered dropdown.
      if(code==='WI'||code==='IR'||code==='KG'||code==='SH'){
        if(!serviceOptions.some(function(opt){return String(opt).trim().toUpperCase()===code;}))serviceOptions.push(code);
        return code;
      }
      return '';
    }

        if(/^(phone|mobile|फोन|फ़ोन|मोबाइल)/.test(label)){
          result.fields.phone=true;var phone=voiceReadPhone_(body);result.phone=phone.value;
          if(phone.error)result.issues.push(phone.error);
          if(!phone.complete&&!voiceClean_(phone.rest))result.pending={field:'phone',text:phone.value};
          if(voiceClean_(phone.rest)&&! /^(और|aur|and)$/i.test(voiceClean_(phone.rest)))itemParts.push(phone.rest);
        }else if(/^(delivery|डिलीवरी|डिलिवरी)/.test(label)){
          result.fields.deliveryDate=true;var date=voiceReadDate_(body);result.deliveryDate=date.value;
          if(date.error)result.issues.push(date.error);
          if(date.consumed){if(voiceClean_(date.rest)&&! /^(और|aur|and)$/i.test(voiceClean_(date.rest)))itemParts.push(date.rest);}
          else result.pending={field:'delivery date',text:voiceClean_(body)};
        }else if(/^(remark|remarks|note|रिमार्क|टिप्पणी)/.test(label)){
          result.fields.remark=true;result.remark=voiceClean_(body);
        }else{
          result.fields.name=true;
          var start=body.search(/(?:^|\s)(?:\d+|एक|दो|तीन|चार|पांच|पाँच|छह|सात|आठ|नौ|दस|one|two|three|four|five|six|seven|eight|nine|ten)\s+/i);
          result.name=voiceClean_(start>=0?body.slice(0,start):body).replace(/\s+(?:और|aur|and)$/i,'').trim();
          if(start>=0)itemParts.push(body.slice(start));
          if(!result.name)result.pending={field:'name',text:''};
        }
      });
      var parsed=voiceReadItems_(itemParts.join(' '));result.items=parsed.items;result.issues=result.issues.concat(parsed.issues);result.leadingSeparator=parsed.leadingSeparator;
      return result;
    }

    var tokenVoiceDraft_=null,tokenVoicePending_=null,tokenVoiceActive_=false,tokenVoiceLastParsed_=null;
    var tokenVoiceScope_='token',tokenVoiceContinuous_=false,tokenVoiceEpoch_=0;
    function voiceButtons_(active){
      ['voiceToken','voiceItems'].forEach(function(id){
        var selected=(id==='voiceItems')===(tokenVoiceScope_==='items');
        var start=document.getElementById(id+'Btn'),stop=document.getElementById(id+'StopBtn');
        if(start)start.disabled=active&&selected;
        if(stop)stop.disabled=!(active&&selected);
      });
    }
    function voiceStatus_(text){
      var el=document.getElementById(tokenVoiceScope_==='items'?'voiceItemsStatus':'voiceTokenStatus');
      if(el)el.textContent=text;
    }
    function getTokenItemsForSave_(){return getTokenItems().filter(function(it){return !voiceIsBlankItem_(it);});}
    function beginVoiceTokenDraft_(){
      tokenVoiceActive_=true;
      tokenVoiceLastParsed_=null;
      tokenVoiceDraft_={items:getTokenItems(),name:document.getElementById('tokenCustomerName').value,phone:document.getElementById('tokenPhone').value,deliveryDate:document.getElementById('tokenDeliveryDate').value,remark:document.getElementById('tokenRemark').value,pending:tokenVoicePending_};
    }
    function mergeVoiceItems_(base, incoming, leadingSeparator){
      var rows=base.map(function(it){return Object.assign({},it);});
      incoming.forEach(function(it,index){
        if(index===0 && !leadingSeparator && rows.length && !voiceIsBlankItem_(it) && !voiceIsBlankItem_(rows[rows.length-1])){
          var old=rows[rows.length-1];if(old.locked)return;rows[rows.length-1]=Object.assign({},old,it,{service:it.service||old.service,rate:it.rate===''?old.rate:it.rate});return;
        }
        if(rows.length&&voiceIsBlankItem_(rows[rows.length-1])){
          if(!voiceIsBlankItem_(it))rows[rows.length-1]=Object.assign({},it);
        }else rows.push(Object.assign({},it));
      });
      return rows;
    }
    function fillVoiceTokenForm_(data, base){
      base=base||{items:getTokenItems(),name:document.getElementById('tokenCustomerName').value,phone:document.getElementById('tokenPhone').value,deliveryDate:document.getElementById('tokenDeliveryDate').value,remark:document.getElementById('tokenRemark').value};
      document.getElementById('tokenCustomerName').value=data.fields.name&&validFormText_(data.name)?data.name:base.name;
      document.getElementById('tokenPhone').value=data.fields.phone?data.phone:base.phone;
      document.getElementById('tokenDeliveryDate').value=data.deliveryDate||base.deliveryDate;
      document.getElementById('tokenRemark').value=data.fields.remark?data.remark:base.remark;
      renderTokenItemsTable(mergeVoiceItems_(base.items,data.items,data.leadingSeparator));
      calcTokenTotals();
    }
    function applyVoiceTokenSpeech_(text, finalResult){
      if(!tokenVoiceActive_)return;
      var spokenRate=readVoiceRate_(text);
      if(tokenVoiceScope_==='items'&&spokenRate.rate!==null&&!spokenRate.rest){
        if(finalResult){var current=getTokenItems(),last=current.length-1;if(last>=0&&!current[last].locked){current[last].rate=spokenRate.rate;renderTokenItemsTable(current);tokenVoiceDraft_=null;}else document.getElementById('voiceItemsStatus').textContent='पहले item जोड़ें या Unlock करें।';}return;
      }
      if(!tokenVoiceDraft_)beginVoiceTokenDraft_();
      var base=tokenVoiceDraft_,data=parseVoiceToken_(text,base.pending);
      if(tokenVoiceScope_==='items'){
        var command=voiceClean_(normalizeVoiceAliases_(text)).replace(/^(?:service|सर्विस|सेवा)\s+/i,'').trim();
        if(/^(grams?|ग्राम)$/.test(command))command='KG';
        if(/^(?:WF|WI|WF|DC|IR|SH|BLK|KG)(?:\s+(?:WF|WI|WF|DC|IR|SH|BLK|KG))*$/i.test(command)){
          var code=command.match(/WF|WI|WF|DC|IR|SH|BLK|KG/gi).pop().toUpperCase(),selected=resolveVoiceService_(code,code==='KG'),target=base.items.length-1;
          while(target>=0&&!base.items[target].item)target--;
          data.items=[];data.issues=[];data.pending=null;
          if(target<0)data.issues=['पहले quantity और item भरें, फिर service बोलें।'];
          else if(!selected)data.issues=['Service '+code+' उपलब्ध नहीं है। Reload services दबाएँ।'];
          else{
            base=Object.assign({},base,{items:base.items.map(function(row){return Object.assign({},row);})});
            base.items[target].service=selected;
            if(!/^KG(?: WF)?$/.test(code))base.items[target].weight=0;
            else if(!(Number(base.items[target].weight)>0))data.issues=['KG चुना गया। अब वजन बोलें, जैसे 3 किलो 400 ग्राम।'];
          }
        }
        var weightOnly=voiceNumberText_(normalizeVoiceAliases_(text)).replace(/(\d)\s+(?:hundred|सौ)(?=\s|$)/gi,function(_,n){return String(Number(n)*100);}).trim();
        if(/^(?:kg(?: wf)?\s+)?\d+(?:\.\d+)?\s*kg(?:\s+\d+(?:\.\d+)?\s*(?:grams?|gm|g|ग्राम))?(?:\s+kg)*$/i.test(weightOnly)){
          var weightResult=voiceReadItems_('1 Weight '+weightOnly),last=base.items.length-1;
          while(last>=0&&!base.items[last].item)last--;
          if(last>=0&&base.items[last].item&&weightResult.items.length===1&&weightResult.items[0].weight>0){
            base=Object.assign({},base,{items:base.items.map(function(row){return Object.assign({},row);})});
            base.items[last].service=resolveVoiceService_(/WF/i.test(weightOnly)||base.items[last].service==='WF'?'WF':'KG',false);base.items[last].weight=weightResult.items[0].weight;
            data.items=[];data.issues=weightResult.issues;
          }else data.issues=['पहले quantity और item बोलें, फिर वजन बताएँ।'];
        }
      }
      if(tokenVoiceScope_==='details')data.items=[];
      if(tokenVoiceScope_==='items'){
        data.fields={};data.name=base.name;data.phone=base.phone;data.deliveryDate=base.deliveryDate;data.remark=base.remark;
      }
      tokenVoiceLastParsed_=data;
      document.getElementById(tokenVoiceScope_==='items'?'voiceItemsTranscript':'voiceTokenTranscript').textContent=text;
      if(tokenVoiceScope_==='items'){
        var qtyOnly=voiceNumberText_(text).trim().match(/^(?:quantity\s+|qty\s+|क्वांटिटी\s+|मात्रा\s+)?(?:\d+\s+)*(\d+)$/i);
        if(qtyOnly){
          var target=base.items.length-1;while(target>=0&&!base.items[target].item)target--;
          data.items=[];data.issues=[];
          if(target>=0&&Number(qtyOnly[1])>0){base=Object.assign({},base,{items:base.items.map(function(r){return Object.assign({},r);})});base.items[target].qty=Number(qtyOnly[1]);}
          else data.issues=['पहले item भरें और positive quantity बोलें।'];
        }
        renderTokenItemsTable(mergeVoiceItems_(base.items,data.items,data.leadingSeparator));calcTokenTotals();
      }else if(tokenVoiceScope_==='details'){
        if(data.fields.name&&validFormText_(data.name))document.getElementById('tokenCustomerName').value=data.name;
        if(data.fields.phone)document.getElementById('tokenPhone').value=data.phone;
        if(data.deliveryDate)document.getElementById('tokenDeliveryDate').value=data.deliveryDate;
      }else fillVoiceTokenForm_(data,base);
      if(!finalResult)return;
      if(tokenVoiceContinuous_){
        voiceStatus_(data.issues.length?data.issues.join(' '):'Listening… Pause allowed. Tap Stop when finished.');
        if(data.fields.phone && /^\d{10}$/.test(data.phone) && !data.fields.name)lookupTokenCustomer();
        if(data.saveRequested&&!data.issues.length&&!data.pending){stopVoiceToken();confirmVoiceToken_(text);}
        return;
      }
      tokenVoicePending_=data.pending;tokenVoiceDraft_=null;tokenVoiceActive_=false;
      document.getElementById('voiceTokenBtn').disabled=false;
      document.getElementById('voiceTokenStopBtn').disabled=true;
      if(data.fields.phone && /^\d{10}$/.test(data.phone) && !data.fields.name){
        if(data.phone!==base.phone)document.getElementById('tokenCustomerName').value='';
        lookupTokenCustomer();
      }
      document.getElementById('voiceTokenStatus').textContent=data.issues.length?data.issues.join(' '):data.pending?'Continue the '+data.pending.field+' field by tapping Start Voice Token again.':'Fields filled. Speak more with Start Voice Token, or review and tap Save Token.';
      if(data.saveRequested&&!data.issues.length&&!data.pending)confirmVoiceToken_(text);
    }

    function confirmVoiceToken_(transcript){
      var name = document.getElementById('tokenCustomerName').value.trim();
      var phone = document.getElementById('tokenPhone').value.trim();
      var items = getTokenItemsForSave_();
      if(!name || !/^\d{10}$/.test(phone) || !items.length || items.some(function(it){ return !it.item||!it.service||!Number.isInteger(Number(it.qty))||it.qty<=0||(/^(KG|WF)$/.test(it.service)&&!(Number(it.weight)>0)); })){
        document.getElementById('voiceTokenStatus').textContent = 'Some details were not understood. Correct the form or speak again.';
        document.getElementById('voiceTokenBtn').disabled = false;
        return;
      }
      var summary = 'Token for ' + name + ', phone ' + phoneDigitsForSpeech_(phone) + ', total quantity ' + document.getElementById('tokenQuantity').value + '. Save karoon? Haan ya nahin boliye.';
      document.getElementById('voiceTokenStatus').textContent = 'Confirming: say Yes/Haan or No/Nahi.';
      
      if(window.speechSynthesis) {
        var utterance = new SpeechSynthesisUtterance(summary);
        utterance.lang = 'hi-IN';
        utterance.rate = 0.9;
        utterance.onend = function(){
          setTimeout(listenVoiceTokenConfirmation_, 400);

    function listenVoiceTokenConfirmation_(){
      if(/LaundryBazaarAndroid/i.test(navigator.userAgent||'')){
        document.getElementById('voiceTokenStatus').textContent = 'Android is listening for Haan/Yes or Nahi/No...';
        if(window.AndroidVoice && typeof window.AndroidVoice.startRecognition === 'function') window.AndroidVoice.startRecognition('confirmation'); else window.onAndroidVoiceError('This Android app needs native voice support.');
        return;
      }
      if(window.AndroidVoice && typeof window.AndroidVoice.startRecognition === 'function'){
        document.getElementById('voiceTokenStatus').textContent = 'Android is listening for Haan/Yes or Nahi/No...';
        if(window.AndroidVoice && typeof window.AndroidVoice.startRecognition === 'function') window.AndroidVoice.startRecognition('confirmation'); else window.onAndroidVoiceError('This Android app needs native voice support.');
        return;
      }
      document.getElementById('voiceTokenStatus').textContent = 'Voice confirmation is available only in the Android app.';
      document.getElementById('voiceTokenBtn').disabled = false;
      document.getElementById('voiceTokenStopBtn').disabled = true;
      return;
      var Recognition = voiceRecognitionClass_();
      if(!Recognition) return;
      var recognition = new Recognition();
      voiceTokenConfirmRecognition = recognition;
      recognition.lang = 'hi-IN';
      recognition.interimResults = false;
      recognition.onresult = function(event){
        var answer = String(event.results[0][0].transcript||'').toLowerCase();
        handleVoiceTokenConfirmation_(answer);
      };
      recognition.onerror = function(){
        document.getElementById('voiceTokenStatus').textContent = 'Confirmation not heard. Tap Start Voice Token to retry.';
        document.getElementById('voiceTokenBtn').disabled = false;
      };
      recognition.onend = function(){ voiceTokenConfirmRecognition = null; };
      try{ recognition.start(); } catch(e){ document.getElementById('voiceTokenStatus').textContent = 'Unable to listen for confirmation.'; }
    }

    // Customer lookup function
    function lookupCustomer() {
      const phoneInput = document.getElementById('phone');
      const phone = phoneInput.value.trim();
      const customerInfo = document.getElementById('customerInfo');
      const loading = document.getElementById('phoneLoading');
      
      // Clear previous timeout
      if (lookupTimeout) {
        clearTimeout(lookupTimeout);
      }
      
      // Clear info if phone is empty or too short
      if (phone.length < 10) {
        customerInfo.textContent = '';
        loading.style.display = 'none';
        return;
      }
      
      // Show loading indicator
      loading.style.display = 'inline-block';
      customerInfo.textContent = 'Searching...';
      customerInfo.className = 'info';
      
      // Set timeout to avoid too many requests
      lookupTimeout = setTimeout(() => {
        if (phone.length === 10 && /^\d{10}$/.test(phone)) {
          console.log('Looking up customer with phone:', phone);
          
          google.script.run
            .withSuccessHandler(function(customerName) {
              loading.style.display = 'none';
              console.log('Customer lookup result:', customerName);
              
              if (customerName && customerName.trim() !== '') {
                document.getElementById('customerName').value = customerName;
                customerInfo.textContent = `Customer found: ${customerName}`;
                customerInfo.className = 'success';
              } else {
                document.getElementById('customerName').value = '';
                customerInfo.textContent = 'New customer - please enter name';
                customerInfo.className = 'info';
              }
            })
            .withFailureHandler(function(error) {
              loading.style.display = 'none';
              customerInfo.textContent = 'Error looking up customer';
              customerInfo.className = 'error';
              console.error('Customer lookup error:', error);
            })
            .getCustomerByPhone(phone, sessionToken);
        } else {
          loading.style.display = 'none';
          customerInfo.textContent = 'Enter valid 10-digit phone number';
          customerInfo.className = 'error';
        }
      }, 800); // Wait 800ms after user stops typing
    }

    function getActiveSessionToken() {

    function addItemRow() {
      let items = Array.from(document.querySelectorAll('.itemRow')).map(row => ({

    function isWeightOrderService_(service){
      return /^(?:KG|WF|KG WF)$/.test(String(service||'').trim().toUpperCase());
    }

    function renderItemsTable(items) {
      items=Array.isArray(items)?items:[];
      items=items.map(function(it){
        var copy=Object.assign({},it),rate=Number(copy.rate)||0,qty=Number(copy.qty)||0,weight=Number(copy.weight)||0;
        copy.amt=Math.round(rate*(isWeightOrderService_(copy.service)?weight:qty));
        return copy;
      });
      let html = `<table><thead><tr>
        <th>Service</th><th>Item</th><th>Rate</th><th>Qty</th><th>Amount</th><th></th></tr></thead><tbody>`;
      for (let i = 0; i < items.length; i++) {
        html += `<tr class="itemRow">
          <td><select class="service" onchange="handleServiceChange(this)">${serviceOptions.map(opt => `<option ${items[i].service===opt ? 'selected' : ''}>${opt}</option>`).join('')}</select></td>
          <td><div class="item-input-stack">
            <input class="item" type="text" value="${items[i].item || ''}" autocomplete="off" oninput="capitalizeInput(this)">
            <input class="weight" type="number" value="${items[i].weight || ''}" min="0" step="0.01" placeholder="Weight" aria-label="Weight" oninput="calcAmtRow(this)">
          </div></td>
          <td><input class="rate" type="number" value="${Math.round(Number(items[i].rate) || 0)}" min="0" step="1" oninput="calcAmtRow(this)"></td>
          <td><input class="qty" type="number" value="${items[i].qty || 0}" min="0" oninput="calcAmtRow(this)"></td>
          <td><input class="amt" type="number" value="${Math.round(Number(items[i].amt) || 0)}" readonly></td>
          <td>${items.length > 1 ? `<button class="btn" type="button" title="Remove item" aria-label="Remove item" onclick="removeItemRow(${i})">Ã</button>` : ''}</td>
        </tr>`;
      }
      html += `</tbody></table>`;
      document.getElementById('itemsTable').innerHTML = html;
      document.querySelectorAll('#itemsTable .service').forEach(function(select){
        let row=select.closest('tr');
        let isKg=isWeightOrderService_(select.value);
        row.querySelector('.qty').disabled=false;
        let weight=row.querySelector('.weight');
        weight.disabled=!isKg;
        weight.style.display=isKg?'block':'none';
      });
      calcTotal();
    }

    function calcAmtRow(el) {
      let row = el.closest('tr');
      let rate = +row.querySelector('.rate').value || 0;
      let qty = +row.querySelector('.qty').value || 0;
      let weight = +row.querySelector('.weight').value || 0;
      let isKg = isWeightOrderService_(row.querySelector('.service').value);
      row.querySelector('.amt').value = Math.round(rate * (isKg ? weight : qty));
      calcTotal();
    }

    function handleServiceChange(select) {
      let row=select.closest('tr');
      let isKg=isWeightOrderService_(select.value);
      let qty=row.querySelector('.qty');
      let weight=row.querySelector('.weight');
      qty.disabled=false;
      weight.disabled=!isKg;
      weight.style.display=isKg?'block':'none';
      if(!isKg) weight.value='';
      calcAmtRow(select);
    }

    function removeItemRow(idx) {
      let rows = Array.from(document.querySelectorAll('.itemRow'));
      rows.splice(idx, 1);
      let arr = rows.map(row => ({
        service: row.querySelector('.service').value,
        item: row.querySelector('.item').value,
        rate: row.querySelector('.rate').value,
        qty: row.querySelector('.qty').value,
        weight: row.querySelector('.weight').value,
        amt: row.querySelector('.amt').value
      }));
      renderItemsTable(arr);
    }

    function calcTotal() {
      let items = document.querySelectorAll('.itemRow');
      let sumAmt = 0, sumQty = 0;
      items.forEach(row => {
        sumAmt += Number(row.querySelector('.amt').value) || 0;
        sumQty += Number(row.querySelector('.qty').value) || 0;
      });
      document.getElementById('totalAmount').value = Math.round(sumAmt);
      document.getElementById('totalQuantity').value = sumQty;
    }

    function saveOrder() {
      let order = {
        orderNumber: document.getElementById('orderNumber').value,
        orderDate: document.getElementById('orderDate').value,
        customerName: document.getElementById('customerName').value.trim(),
        deliveryDate: document.getElementById('deliveryDate').value,
        phone: document.getElementById('phone').value.trim(),
        totalAmount: document.getElementById('totalAmount').value,
        items: [],
        sourceTokenNumber: sourceTokenNumber || ''
      };
      let rows = document.querySelectorAll('.itemRow');
      rows.forEach(row => {
        order.items.push({
          service: row.querySelector('.service').value,
          item: row.querySelector('.item').value.trim(),
          rate: row.querySelector('.rate').value,
          qty: row.querySelector('.qty').value,
          weight: row.querySelector('.weight').value,
          amt: row.querySelector('.amt').value
        });
      });
      let error = "";
      if (!/^\d{10}$/.test(order.phone)) error = "Phone must be exactly 10 digits.";
      else if (new Date(order.deliveryDate) < new Date(order.orderDate)) error = "Delivery date cannot be before order date.";
      else if (!order.customerName) error = "Customer Name required.";
      else if (order.items.length === 0 || order.items.every(i => !i.service && !i.item)) error = "At least one item is required.";
      else if (order.items.some(i => String(i.service).toUpperCase()==='KG' && !(Number(i.weight)>0))) error = "Weight is required for KG service.";
      if (error) {
        document.getElementById('orderError').textContent = error;
        document.getElementById('orderError').className = 'error';
        return;
      }
      document.getElementById('orderError').textContent = "";
      document.getElementById('saveOrderBtn').disabled = true;
      google.script.run.withSuccessHandler(() => {
        document.getElementById('printInvoiceBtn').style.display = "inline-block";
        document.getElementById('printTagBtn').style.display = "inline-block";
        document.getElementById('remoteInvoiceBtn').style.display = "inline-block";
        document.getElementById('remoteTagBtn').style.display = "inline-block";
        document.getElementById('whatsappInvoiceBtn').style.display = "inline-block";
        document.getElementById('orderError').textContent = "Order Saved!";
        document.getElementById('orderError').className = 'success';
        if (sourceTokenNumber) {
          sourceTokenNumber = '';
          if (currentUser && (currentUser.role==='admin' || currentUser.role==='manager')) loadTokens();
        }
      }).withFailureHandler(error => {
        document.getElementById('orderError').textContent = "Error: " + error;
        document.getElementById('orderError').className = 'error';
        document.getElementById('saveOrderBtn').disabled = false;
      }).saveOrder(order, getActiveSessionToken());
    }

    function prepareAndroidPrintWindow(title) {
      var win=null;
      try {
        win=window.open('', '_blank');
        if(win && win.document){
          win.document.open();
          win.document.write('<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+title+'</title></head><body style="font-family:Arial,sans-serif;padding:16px;">Preparing '+title+'...</body></html>');
          win.document.close();
        }
      } catch(e) { win=null; }
      return win;
    }

    function printHtmlOnAndroid(win, html, title) {
      var mobileStyle='<meta name="viewport" content="width=device-width,initial-scale=1">'+
        '<style>*{box-sizing:border-box}html,body{width:100%;max-width:100%;margin:0;overflow-x:hidden}'+
        'body{padding:10px;font-family:Arial,sans-serif}img,table{max-width:100%!important}'+
        'table{width:100%!important;table-layout:fixed;border-collapse:collapse}th,td{overflow-wrap:anywhere;word-break:break-word}'+
        '@media print{body{padding:0}}</style>';
      var documentHtml=String(html||'');
      if(/<head[\s>]/i.test(documentHtml)){
        documentHtml=documentHtml.replace(/<head([^>]*)>/i,'<head$1>'+mobileStyle);
      } else {
        documentHtml='<!doctype html><html><head><title>'+title+'</title>'+mobileStyle+'</head><body>'+documentHtml+'</body></html>';
      }
      if(win && !win.closed && win.document){
        win.document.open();
        win.document.write(documentHtml);
        win.document.close();
        setTimeout(function(){
          try { win.focus(); win.print(); } catch(e) {}
        },700);
        return;
      }
      var frame=document.createElement('iframe');
      frame.style.position='fixed';
      frame.style.left='0';
      frame.style.bottom='0';
      frame.style.width='1px';
      frame.style.height='1px';
      frame.style.border='0';
      frame.style.opacity='0';
      document.body.appendChild(frame);
      var doc=frame.contentWindow.document;
      doc.open(); doc.write(documentHtml); doc.close();
      setTimeout(function(){
        try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch(e) {
          alert('Android print service is unavailable. Enable a print service or Save as PDF in Android settings.');
        }
        setTimeout(function(){ if(frame.parentNode) frame.parentNode.removeChild(frame); },1500);
      },700);
    }

    function isAndroidDevice(){

    function showAndroidAction(title, message, url, buttonText){
      var old=document.getElementById('androidActionOverlay');
      if(old) old.remove();
      var overlay=document.createElement('div');
      overlay.id='androidActionOverlay';
      overlay.style.cssText='position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;';
      var box=document.createElement('div');
      box.style.cssText='width:100%;max-width:420px;background:#fff;border:3px solid #FFA500;border-radius:12px;padding:20px;text-align:center;';
      var heading=document.createElement('h2'); heading.textContent=title;
      var info=document.createElement('p'); info.textContent=message;
      var action=document.createElement('a');
      action.className='btn'; action.textContent=buttonText; action.href=url;
      action.target='_blank'; action.rel='noopener external';
      action.style.cssText='display:block;width:100%;margin:12px 0;padding:14px;';
      var close=document.createElement('button');
      close.className='btn'; close.type='button'; close.textContent='Close';
      close.style.cssText='display:block;width:100%;background:#666;';
      close.onclick=function(){overlay.remove();};
      box.appendChild(heading); box.appendChild(info); box.appendChild(action); box.appendChild(close);
      overlay.appendChild(box); document.body.appendChild(overlay);
    }

    function saveAndSendInvoiceWhatsapp() {
      if (!sessionToken) {
        alert('Please login first.');
        return;
      }

      const orderNumber = document.getElementById('orderNumber').value;
      const phone = document.getElementById('phone').value.trim();
      const customerName = document.getElementById('customerName').value.trim();
      const totalAmount = document.getElementById('totalAmount').value;
      const totalQuantity = document.getElementById('totalQuantity').value;

      if (!orderNumber || !phone || !customerName) {
        alert('Please save the order first and ensure Order Number, Customer Name, and Phone are filled.');
        return;
      }

      const isAndroid=/Android/i.test(navigator.userAgent||'');
      let whatsappWindow=null;
      if(!isAndroid){
        // This must happen during the original click. Browsers block a window
        // first opened later inside the asynchronous Apps Script callback.
        whatsappWindow=window.open('about:blank','LaundryBazaarWhatsApp');
        if(!whatsappWindow){
          alert('WhatsApp Web popup was blocked. Please allow popups for this site and press Open WhatsApp again.');
          return;
        }
        whatsappWindow.document.write('<!doctype html><html><head><title>WhatsApp</title></head><body style="font-family:Arial,sans-serif;font-size:12px;font-weight:bold;padding:20px;">Preparing invoice for WhatsApp Web...</body></html>');
        whatsappWindow.document.close();
      }

      google.script.run
        .withSuccessHandler(function(fileUrl) {
          if (!fileUrl || String(fileUrl).indexOf('Error ') === 0 || String(fileUrl).indexOf('Error generating PDF') === 0) {
            if(whatsappWindow) whatsappWindow.close();
            alert('Unable to generate invoice PDF: ' + (fileUrl || 'Unknown error'));
            return;
          }

          const countryCode = '91';
          let phoneNumber = phone.replace(/\D/g, '');
          if (phoneNumber.length === 10) phoneNumber = countryCode + phoneNumber;

          const message = encodeURIComponent(
            `Hello ${customerName}, your invoice from Laundry Bazaar is ready.\n` +
            `Order Number: ${orderNumber}\n` +
            `Total Amount: â¹${totalAmount}\n` +
            `Total Quantity: ${totalQuantity}\n` +
            `Download Invoice: ${fileUrl}`
          );

          const whatsappUrl=isAndroid
            ? `https://wa.me/${phoneNumber}?text=${message}`
            : `https://web.whatsapp.com/send?phone=${phoneNumber}&text=${message}`;
          if(isAndroid){
            showAndroidAction('WhatsApp Ready','Tap below to open this chat in the WhatsApp app installed on your device.',whatsappUrl,'Open WhatsApp');
          } else {
            try {
              whatsappWindow.location.href=whatsappUrl;
              whatsappWindow.focus();
            } catch(e) {
              alert('Unable to open WhatsApp Web. Please allow popups and try again.');
            }
          }
        })
        .withFailureHandler(function(error) {
          if(whatsappWindow) whatsappWindow.close();
          alert('Error generating invoice: ' + (error && error.message ? error.message : error));
        })
        .saveInvoicePdfAndGetLink(orderNumber, sessionToken);
    }

    if(!currentUser||!getActiveSessionToken())return;
    var rows=getTokenItems();if(!rows[index])return;
    if(rows[index].locked){alert('पहले item Unlock करें।');return;}
    var target=rows[index],selectedIndex=rows.slice(0,index).filter(function(r){return !voiceIsBlankItem_(r);}).length;
    rows=rows.filter(function(r){return !voiceIsBlankItem_(r);});
    if(voiceIsBlankItem_(target))rows.splice(selectedIndex,0,target);
    stopVoiceToken();this.render(rows);this.active=true;this.itemIndex=selectedIndex;this.entryPending=null;this.acceptEntryOnce=false;
    this.ask('item','लाइन '+(index+1)+' सुधारें। मात्रा और आइटम का नाम बोलें।');
  },
  render:function(rows,allowLockedChanges){renderTokenItemsTable(rows,!!allowLockedChanges);calcTokenTotals();},
  afterDate:function(){
    var rows=this.rows();if(rows.length){this.itemIndex=0;this.nextItemField();}else{this.itemIndex=0;this.ask('item','मात्रा और आइटम का नाम बोलें।');}
  },
  nextItemField:function(){
    var rows=this.rows();
    for(var i=this.itemIndex;i<rows.length;i++){
      this.itemIndex=i;var row=rows[i];
      if(row.locked)continue;
      if(!row.item||!Number.isInteger(Number(row.qty))||Number(row.qty)<=0){this.ask('item','इस कपड़े की सही quantity और नाम बोलें।');return;}
      if(!row.service){this.ask('service',row.qty+' '+row.item+' की सर्विस बोलें।');return;}
      if(/^(KG|WF|KG WF)$/.test(String(row.service).toUpperCase())&&!(Number(row.weight)>0)){this.ask('weight',row.qty+' '+row.item+' का कुल वजन बोलें।');return;}
      if(row.rate===''||row.rate==null||!Number.isFinite(Number(row.rate))||Number(row.rate)<0){this.ask('rate',row.qty+' '+row.item+' का रेट बोलें।');return;}
      // Keep one short line confirmation for accuracy, but avoid the longer
      // explanatory conversation used for new users.
      var summary=row.qty+' '+row.item+', '+row.service+(/^(KG|WF|KG WF)$/.test(String(row.service).toUpperCase())?', '+row.weight+' किलो':'')+', '+row.rate+' रुपये';
      this.ask('row_confirm',summary+'। सही है तो अगले आइटम की मात्रा और नाम बोलें, या बस कहें।');return;
    }
    this.ask('more','अगले आइटम की मात्रा और नाम बोलें, या बस कहें।');
  },
  snapshot:function(){return JSON.stringify({phone:this.value('tokenPhone'),name:this.value('tokenCustomerName'),date:this.value('tokenDeliveryDate'),items:this.rows()});},
  review:function(){
    var rows=this.rows();
    if(!/^\d{10}$/.test(this.value('tokenPhone'))){this.ask('phone','सही 10 अंकों का फोन नंबर बोलें।');return;}
    if(!this.value('tokenCustomerName')){this.ask('name','आपका नाम क्या है?');return;}
    if(!this.value('tokenDeliveryDate')){this.ask('date','डिलीवरी किस तारीख को चाहिए?');return;}
    if(!rows.length){this.itemIndex=0;this.ask('item','पहले quantity और कपड़े का नाम बोलें।');return;}
    var bad=rows.findIndex(function(r){return !r.locked||!r.item||!r.service||!Number.isInteger(Number(r.qty))||Number(r.qty)<=0||r.rate===''||r.rate==null||!Number.isFinite(Number(r.rate))||Number(r.rate)<0||(/^(KG|WF|KG WF)$/.test(String(r.service).toUpperCase())&&!(Number(r.weight)>0));});
    if(bad>=0){this.itemIndex=bad;this.nextItemField();return;}
    var totalQuantity=rows.reduce(function(total,row){return total+Number(row.qty||0);},0);
    this.el('tokenQuantity').value=totalQuantity;
    this.reviewSnapshot=this.snapshot();
    this.ask('review','कुल आइटम '+totalQuantity+' हैं। सही?');
  },
  receive:function(answer){
    if(!this.active||!this.listening)return;
    var text=voiceClean_(answer),self=this;if(!text)return;
    this.cancelInput();this.promptId='';this.el('guidedTranscript').textContent=text;
    if(/^(stop|cancel|रुको|रुकिए|बंद करो|रद्द करो)$/i.test(text)){this.stop(true);return;}
    var state=this.state,rows=this.rows(),result;
    var rateReply=readVoiceRate_(text);
    if(state==='rate'){
      var guidedRate=guidedRateValue_(text);
      if(guidedRate!==null)rateReply={rate:guidedRate,rest:''};
    }
    var correction=voiceNumberText_(text).match(/^(?:line|row|लाइन|पंक्ति)\s+(\d+)\s+(?:correct|edit|change|सुधारो|सुधारें|बदलो|बदलें)$/i);
    if(correction){var index=Number(correction[1])-1;if(index>=0&&index<getTokenItems().length)this.correctItem(index);else this.ask(state,'यह लाइन नहीं मिली। सही लाइन नंबर बोलें।');return;}
    if(state==='confirm_entry'){
      var pending=this.entryPending,accepted=this.yesNo(text);
      if(!pending){this.stop(true);return;}
      // The next field itself implicitly confirms the previous one.
      if(pending.state==='name'){
        var chainedDate=voiceDateToIso_(text);
        if(chainedDate){
          this.el('tokenCustomerName').value=pending.text;this.entryPending={state:'date',text:text,label:'डिलीवरी तारीख'};
          this.ask('confirm_entry','डिलीवरी तारीख '+text+'। सही है तो मात्रा और आइटम का नाम बोलें।');return;
        }
      }
      if(pending.state==='date'){
        var chainedItems=voiceReadItems_(text),chainedRows=chainedItems.items.filter(function(r){return !voiceIsBlankItem_(r);});
        if(chainedRows.length===1&&chainedRows[0].item&&Number.isInteger(Number(chainedRows[0].qty))&&Number(chainedRows[0].qty)>0&&!chainedItems.issues.some(function(issue){return !/^(Select the service|Weight is required)/.test(issue);})){
          var chainedIso=voiceDateToIso_(pending.text);if(!chainedIso){this.ask('date','डिलीवरी तारीख दोबारा बोलें।');return;}
          this.el('tokenDeliveryDate').value=chainedIso;this.entryPending=null;
          chainedRows[0].service=resolveVoiceService_('WI',false)||'WI';chainedRows[0].weight='';chainedRows[0].rate='';chainedRows[0].locked=false;
          rows.splice(this.itemIndex,this.itemIndex<rows.length?1:0,chainedRows[0]);this.render(rows,true);
          this.ask('service_fast','सर्विस WI है। WI नहीं है तो दूसरी सर्विस बोलें, नहीं तो रेट बोलें।');return;
        }
      }
      if(accepted===true){this.entryPending=null;this.state=pending.state;this.acceptEntryOnce=true;this.listening=true;this.receive(pending.text);}
      else if(accepted===false){this.entryPending=null;this.el('guidedTranscript').textContent='';this.ask(pending.state,'ठीक है, '+pending.label+' दोबारा बोलें।');}
      else this.ask('confirm_entry',pending.text+'। सही?');
      return;
    }
    if(state==='row_confirm'){
      var rowAnswer=this.yesNo(text),row=rows[this.itemIndex];
      if(!row){this.ask('item','मात्रा और आइटम का नाम बोलें।');return;}
      if(this.isStopAnswer(text)){
        row.locked=true;this.render(rows,true);this.itemIndex++;this.review();return;
      }
      var directItems=voiceReadItems_(text),directRows=directItems.items.filter(function(r){return !voiceIsBlankItem_(r);});
      if(directRows.length===1&&directRows[0].item&&Number.isInteger(Number(directRows[0].qty))&&Number(directRows[0].qty)>0&&!directItems.issues.some(function(issue){return !/^(Select the service|Weight is required)/.test(issue);})){
        row.locked=true;directRows[0].service=resolveVoiceService_('WI',false)||'WI';directRows[0].weight='';directRows[0].rate='';directRows[0].locked=false;
        this.itemIndex=rows.length;rows.push(directRows[0]);this.render(rows,true);
        this.ask('service_fast','सर्विस WI है। WI नहीं है तो दूसरी सर्विस बोलें, नहीं तो रेट बोलें।');return;
      }
      if(rowAnswer===true){row.locked=true;this.render(rows,true);this.itemIndex++;this.nextItemField();}
      else if(rowAnswer===false){rows[this.itemIndex]={service:'',item:'',rate:'',qty:1,weight:'',amt:0,locked:false};this.render(rows,true);this.ask('item','ठीक है। मात्रा और आइटम का नाम दोबारा बोलें।');}
      else this.ask('row_confirm','केवल हाँ, ओके या नहीं बोलें।');
      return;
    }
    if(state==='item_name_confirm'){
      var itemAnswer=this.yesNo(text),draft=this.pendingItemDraft;
      if(itemAnswer===true&&draft){
        this.pendingItemDraft=null;
        rows.splice(this.itemIndex,this.itemIndex<rows.length?1:0,draft);this.render(rows,true);
        this.ask('service_fast','सर्विस WI है। WI नहीं है तो दूसरी सर्विस बोलें, नहीं तो रेट बोलें।');
      }else if(itemAnswer===false){
        this.pendingItemDraft=null;this.ask('item','मात्रा और आइटम का नाम दोबारा बोलें।');
      }else this.ask('item_name_confirm','मात्रा '+(draft?draft.qty:'')+', आइटम '+(draft?draft.item:'')+'। सही?');
      return;
    }
    if(state==='service_confirm'){
      var serviceAnswer=this.yesNo(text),confirmedService=this.pendingService;
      if(serviceAnswer===true&&confirmedService){
        this.pendingService='';rows[this.itemIndex].service=confirmedService;
        if(!/^(KG|WF|KG WF)$/.test(String(confirmedService).toUpperCase()))rows[this.itemIndex].weight=0;
        this.render(rows);this.nextItemField();
      }else if(serviceAnswer===false){
        this.pendingService='';this.ask('service_fast','दूसरी सर्विस बोलें, या WI के लिए हाँ बोलें।');
      }else this.ask('service_confirm','सर्विस '+confirmedService+'। सही?');
      return;
    }
    // Repeat and confirm each customer-detail answer before the next field.
    if(/^(phone|name|date)$/.test(state)&&!this.acceptEntryOnce){
      var labels={phone:'फोन नंबर',name:'नाम',date:'डिलीवरी तारीख'};
      if(!this.validEntry(state,text)){this.entryPending=null;this.el('guidedTranscript').textContent='';this.ask(state,labels[state]+' का सही जवाब दोबारा बोलें। Hindi या English दोनों मान्य हैं।');return;}
      this.entryPending={state:state,text:text,label:labels[state]};
      var confirmationText=state==='phone'?phoneDigitsForSpeech_(voiceReadPhone_(text).value):text;
      var confirmationQuestion=state==='phone'?'फोन नंबर '+confirmationText+'। नंबर सही है तो हाँ बोलें, नाम सर्च होगा।':state==='name'?'नाम '+confirmationText+'। सही है तो डिलीवरी तारीख बताएं।':'डिलीवरी तारीख '+confirmationText+'। सही है तो मात्रा और आइटम का नाम बोलें।';
      this.ask('confirm_entry',confirmationQuestion);return;
    }
    this.acceptEntryOnce=false;
    if(state==='rate'){
      var target=this.itemIndex;if(!rows[target]||rows[target].locked){this.ask('more','पहले आइटम जोड़ें या Unlock करें। और कपड़े हैं?');return;}
      if(rateReply.rate===null||rateReply.rest){this.ask('rate','रेट साफ़ बोलें।');return;}
      rows[target].rate=rateReply.rate;this.render(rows);this.nextItemField();return;
    }
    if(state==='phone'){
      var phoneText=text.replace(/^(?:phone|mobile|फोन|मोबाइल)(?:\s*(?:number|नंबर|नम्बर))?\s*/i,'');
      var phone=voiceReadPhone_(phoneText);
      if(!phone.complete&&this.phoneBuffer)phone=voiceReadPhone_(this.phoneBuffer+' '+phoneText);
      if(!phone.complete){this.phoneBuffer=phone.value.length<10?phone.value:'';this.ask('phone',this.phoneBuffer?'नंबर पूरा नहीं हुआ। बाकी अंक बोलें या पूरा 10 अंकों का नंबर दोहराएँ।':'सही 10 अंकों का फोन नंबर दोबारा बोलें।');return;}
      this.phoneBuffer='';this.el('tokenPhone').value=phone.value;this.el('tokenCustomerName').value='';
      this.state='lookup';this.epoch++;var epoch=this.epoch;
      this.el('guidedQuestion').textContent='Customer का नाम backend से जाँच रहा है…';
      this.timer=setTimeout(function(){if(self.active&&self.epoch===epoch)self.fail('Customer lookup में समय लग रहा है। Connection जाँचें।');},20000);
      google.script.run.withSuccessHandler(function(name){
        if(!self.active||self.epoch!==epoch||self.value('tokenPhone')!==phone.value)return;
        if(self.timer){clearTimeout(self.timer);self.timer=null;}
        if(typeof name==='string'&&name.trim()){
          self.entryPending={state:'name',text:name.trim(),label:'नाम'};self.ask('confirm_entry','नाम '+name.trim()+'। सही है तो डिलीवरी तारीख बताएं।');
        }
        else self.ask('name','इस नंबर का नाम नहीं मिला। आपका नाम क्या है?');
      }).withFailureHandler(function(e){if(self.active&&self.epoch===epoch)self.fail('Customer lookup नहीं हुआ: '+(e.message||e));}).getCustomerByPhone(phone.value,getActiveSessionToken());return;
    }
    if(state==='name'){
      var name=text.replace(/^(?:मेरा नाम|नाम|name|my name is)\s*/i,'').replace(/\s+है$/,'').trim();
      if(!name||/^\d+$/.test(name)){this.ask('name','नाम साफ़ बोलें।');return;}
      this.el('tokenCustomerName').value=name;this.ask('date','डिलीवरी कब चाहिए? तारीख बोलें।');return;
    }
    if(state==='date'){
      var value=voiceDateToIso_(text);
      if(!value){this.ask('date','तारीख समझ नहीं आई। दोबारा बोलें।');return;}
      this.el('tokenDeliveryDate').value=value;
      this.detailsOnly=false;
      this.afterDate();return;
    }
    if(state==='item'){
      result=voiceReadItems_(text);var incoming=result.items.filter(function(r){return !voiceIsBlankItem_(r);});
      if(incoming.length!==1||incoming.some(function(r){return !r.item||!Number.isInteger(Number(r.qty))||Number(r.qty)<=0;})){this.ask('item','एक आइटम की मात्रा और नाम बोलें।');return;}
      if(result.issues.some(function(issue){return !/^(Select the service|Weight is required)/.test(issue);})){this.ask('item','पूरी आइटम लाइन साफ़ दोहराएँ।');return;}
      incoming[0].service=resolveVoiceService_('WI',false)||'WI';incoming[0].weight='';incoming[0].rate='';incoming[0].locked=false;
      rows.splice(this.itemIndex,this.itemIndex<rows.length?1:0,incoming[0]);this.render(rows,true);
      this.ask('service_fast','सर्विस WI है। WI नहीं है तो दूसरी सर्विस बोलें, नहीं तो रेट बोलें।');return;
    }
    if(state==='service_fast'){
      var fastTarget=this.itemIndex;if(!rows[fastTarget]){this.ask('item','मात्रा और आइटम बोलें।');return;}
      var fastService=resolveVoiceService_(text,false),fastRate=guidedRateValue_(text),fastAnswer=this.yesNo(text);
      if(fastService){
        this.pendingService=fastService;this.ask('service_confirm','सर्विस '+fastService+'। सही?');return;
      }
      if(fastRate!==null){rows[fastTarget].rate=fastRate;this.render(rows);this.nextItemField();return;}
      if(fastAnswer===true){this.nextItemField();return;}
      this.ask('service_fast','WI नहीं है तो दूसरी सर्विस बोलें, नहीं तो रेट बोलें।');return;
    }
    if(state==='service'){
      var service=resolveVoiceService_(text,false);
      var weightedService=voiceReadItems_('1 Weight '+text);
      var weightedRow=weightedService.items[0];
      if(weightedService.items.length===1&&!weightedService.issues.length&&weightedRow.item==='Weight'&&weightedRow.weight>0&&/^(KG|WF|KG WF)$/.test(String(weightedRow.service).toUpperCase()))service=weightedRow.service;
      if(!service){this.ask('service','मैंने सुना '+text+'। Service समझ नहीं आई। वॉश आयरन, प्रेस, ड्राई क्लीन, के जी या फोल्ड बोलें।');return;}
      if(!rows[this.itemIndex]){this.ask('item','कपड़े की quantity और नाम दोबारा बोलें।');return;}
      rows[this.itemIndex].service=service;if(!/^(KG|WF|KG WF)$/.test(String(service).toUpperCase()))rows[this.itemIndex].weight=0;
      if(weightedRow&&weightedRow.service===service&&weightedRow.weight>0&&!weightedService.issues.length)rows[this.itemIndex].weight=weightedRow.weight;
      this.render(rows);this.nextItemField();return;
    }
    if(state==='weight'){
      var weightText=voiceNumberText_(text).replace(/^(?:वजन|वज़न|weight)\s*/i,'');
      if(/^\d+(?:\.\d+)?$/.test(weightText))weightText+=' kg';
      result=voiceReadItems_('1 Weight '+weightText);
      if(result.items.length!==1||!(result.items[0].weight>0)||result.issues.length){this.ask('weight','वजन दोबारा बोलें।');return;}
      if(!rows[this.itemIndex]){this.ask('item','कपड़े की quantity और नाम दोबारा बोलें।');return;}
      rows[this.itemIndex].weight=result.items[0].weight;
      if(/^(WF|KG WF)$/.test(String(result.items[0].service).toUpperCase()))rows[this.itemIndex].service=result.items[0].service;
      this.render(rows);this.nextItemField();return;
    }
    if(state==='more'){
      if(this.isStopAnswer(text)){this.review();return;}
      var more=this.yesNo(text);if(/^(और|aur)$/i.test(text))more=true;
      if(/^(?:(?:yes|haa|haan|han|ha|हाँ|हां)\s+)?(?:jodna hai|jodna|jodo|aur jodna hai|add|add more|जोड़ना है|जोड़ना|जोड़ो|जोडना है|और जोड़ना है)[.!?।]?$/i.test(text))more=true;
      if(more===true){this.itemIndex=rows.length;this.ask('item','मात्रा और आइटम बोलें।');return;}
      if(more===false){this.review();return;}
      // In fast mode the user may speak the next item directly instead of
      // saying yes and waiting for one more question.
      result=voiceReadItems_(text);var nextItems=result.items.filter(function(r){return !voiceIsBlankItem_(r);});
      if(this.fastMode&&nextItems.length===1&&nextItems[0].item&&Number.isInteger(Number(nextItems[0].qty))&&Number(nextItems[0].qty)>0&&!result.issues.some(function(issue){return !/^(Select the service|Weight is required)/.test(issue);})){
        nextItems[0].service=resolveVoiceService_('WI',false)||'WI';nextItems[0].weight='';nextItems[0].rate='';nextItems[0].locked=false;
        this.itemIndex=rows.length;rows.push(nextItems[0]);this.render(rows,true);
        this.ask('service_fast','सर्विस WI है। WI नहीं है तो दूसरी सर्विस बोलें, नहीं तो रेट बोलें।');return;
      }
      this.ask('more','अगले आइटम की मात्रा और नाम बोलें, या बस कहें।');return;
    }
    if(state==='remark'){this.el('tokenRemark').value=this.yesNo(text)===false?'':text;this.review();return;}
    if(state==='review'){
      var yes=this.yesNo(text);
      if(yes===true){
        if(this.snapshot()!==this.reviewSnapshot){this.review();return;}
        this.suppressAutoOnce=true;this.stop(false);this.el('guidedQuestion').textContent='आपकी पुष्टि मिली। Token backend में save किया जा रहा है…';saveTokenBooking();
      }else if(yes===false){this.stop(false);this.el('guidedQuestion').textContent='Token save नहीं हुआ। Manual form में सुधार करें, फिर Save Token दबाएँ या बातचीत फिर शुरू करें।';}
      else this.ask('review','टोकन सेव करना है? केवल हाँ या नहीं बोलें।');
    }
  }
};
window.onAndroidGuidedPromptDone=function(id){guidedVoice_.promptDone(id);};
window.onAndroidGuidedPartial=function(text){if(guidedVoice_.active&&guidedVoice_.listening)guidedVoice_.el('guidedTranscript').textContent=String(text||'');};
document.addEventListener('visibilitychange',function(){if(document.hidden&&guidedVoice_.active)guidedVoice_.stop(true);});
