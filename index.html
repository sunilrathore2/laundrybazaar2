<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f59e0b">
  <title>Laundry Bazaar</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-width:0;max-width:100%;height:100%;margin:0;overflow:hidden;background:#f4f6fa;font-family:Arial,sans-serif}
    main{display:flex;height:100%;align-items:center;justify-content:center;padding:24px;text-align:center}
    .card{width:min(100%,420px);padding:24px;border-radius:14px;background:#fff;box-shadow:0 5px 22px rgba(23,43,77,.14)}
    h1{margin:0 0 10px;color:#f97316;font-size:24px}
    p{margin:0 0 18px;color:#475467;font-size:15px}
    a{display:block;width:100%;padding:13px 16px;border-radius:8px;background:#f97316;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Laundry Bazaar</h1>
      <p>Opening application…</p>
      <a id="openApp" href="#">Open Application</a>
    </div>
  </main>
  <script>
    (function(){
      'use strict';
      var APP_URL='https://script.google.com/macros/s/AKfycbzDU2W9rCXVSV0PVHjbTIymrJTLQJf_A9UGqF6JxtUvFq9nQ4fum0pp7556NtVu293yPg/exec?v=3.9-r2';
      document.getElementById('openApp').href=APP_URL;
      window.location.replace(APP_URL);
    }());
  </script>
</body>
</html>
