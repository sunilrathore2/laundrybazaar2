<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f59e0b">
  <title>Laundry Bazaar</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-width:0;max-width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#fff}
    #appFrame{display:block;width:100%;min-width:0;max-width:100%;height:100%;border:0;margin:0;padding:0;background:#fff}
    #loading{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#fff;color:#f97316;font:700 16px Arial,sans-serif}
  </style>
</head>
<body>
  <div id="loading">Laundry Bazaar खोल रहा है…</div>
  <iframe
    id="appFrame"
    title="Laundry Bazaar"
    src="https://script.google.com/macros/s/AKfycbzDU2W9rCXVSV0PVHjbTIymrJTLQJf_A9UGqF6JxtUvFq9nQ4fum0pp7556NtVu293yPg/exec?v=3.9-r2"
    allow="microphone; camera; clipboard-read; clipboard-write; autoplay"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="yes"
    onload="document.getElementById('loading').style.display='none'">
  </iframe>
</body>
</html>
